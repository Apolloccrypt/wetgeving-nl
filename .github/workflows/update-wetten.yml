name: Dagelijkse wetten-update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-wetten:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout wetgeving-nl
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies installeren
        run: pip install requests pyyaml

      - name: Legalize-nl klonen (fallback)
        run: |
          git clone --depth 1 https://github.com/legalize-dev/legalize-nl.git /tmp/legalize-nl
          echo "Legalize-nl: $(ls /tmp/legalize-nl/nl/ | wc -l) bestanden"

      - name: Wetten bijwerken
        run: |
          python scripts/dagelijkse_update.py --output wetten/ --dagen 2

      - name: Check wijzigingen
        id: check
        run: |
          git diff --quiet wetten/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Genereer index + zoekindex + verwijzingen + meta + sitemap
        run: |
          python scripts/genereer_index.py --wetten wetten/ --output index.json

      - name: Genereer changelog + feeds + samenvattingen-index
        run: |
          python scripts/genereer_changelog.py --index index.json --output changelog.json --dagen 60
          python scripts/genereer_feeds.py --changelog changelog.json --output-dir .
          python -c "import json,glob,os; open('samenvattingen/index.json','w').write(json.dumps(sorted(os.path.basename(f)[:-3] for f in glob.glob('samenvattingen/BWBR*.md'))))"

      - name: Commit en push
        if: steps.check.outputs.changes == 'true'
        run: |
          git config user.name  "wetgeving-bot"
          git config user.email "bot@wetgeving-nl"
          AANTAL=$(git diff --name-only wetten/ | wc -l)
          git add wetten/ index.json zoekindex.json verwijzingen.json meta.json sitemap.xml changelog.json feed.xml feed/ samenvattingen/index.json
          git commit -m "Dagelijkse update: $AANTAL wetten bijgewerkt ($(date +%Y-%m-%d))"
          git push

      - name: Geen wijzigingen
        if: steps.check.outputs.changes != 'true'
        run: echo "Geen wetswijzigingen vandaag."
