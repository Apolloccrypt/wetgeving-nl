name: 🔄 Dagelijkse wetten-update

on:
  schedule:
    - cron: '0 6 * * *'   # Elke dag 06:00 UTC
  workflow_dispatch:        # Ook handmatig te starten via GitHub UI

jobs:
  update-wetten:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout wetgeving-nl
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies installeren
        run: pip install pyyaml

      - name: Nieuwste legalize-nl ophalen
        run: |
          git clone --depth 1 https://github.com/legalize-dev/legalize-nl.git /tmp/legalize-nl
          echo "✅ legalize-nl gecloned: $(ls /tmp/legalize-nl/nl/ | wc -l) bestanden"

      - name: Cleanup en bijwerken
        run: |
          python scripts/cleanup_legalize.py \
            --input /tmp/legalize-nl/nl/ \
            --output wetten/

      - name: Check of er wijzigingen zijn
        id: check
        run: |
          git diff --quiet wetten/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit en push
        if: steps.check.outputs.changes == 'true'
        run: |
          git config user.name  "wetgeving-bot"
          git config user.email "bot@wetgeving-nl"

          # Hoeveel wetten zijn gewijzigd?
          AANTAL=$(git diff --name-only wetten/ | wc -l)

          git add wetten/
          git commit -m "⚖️ Dagelijkse update: $AANTAL wetten bijgewerkt ($(date +%Y-%m-%d))"
          git push

      - name: Samenvatting
        run: |
          echo "### Update $(date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "Wetten in repo: $(find wetten/ -name '*.md' | wc -l)" >> $GITHUB_STEP_SUMMARY
