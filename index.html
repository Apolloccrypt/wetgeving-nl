<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wetgeving-nl — Nederlandse wetgeving open en leesbaar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --rood: #AE1C28;
  --wit: #ffffff;
  --blauw: #21468B;
  --oranje: #E07020;
  --donker: #0a0a0f;
  --grijs: #f5f5f1;
  --tekst: #1a1a2e;
  --zacht: #6b7280;
  --rand: #e8e8e3;
  --kaart-hover: #fafaf6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Syne',sans-serif; background:var(--wit); color:var(--tekst); min-height:100vh; }

/* ── Header ── */
header {
  background: var(--donker);
  color: var(--wit);
  padding: 2.5rem 2rem 2rem;
  position: relative;
  overflow: hidden;
}
header::before {
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:5px;
  background: linear-gradient(180deg, var(--rood) 33%, var(--wit) 33%, var(--wit) 66%, var(--blauw) 66%);
}
.header-inner { max-width:1200px; margin:0 auto; }
.header-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem; }
.logo { font-size:2.2rem; font-weight:800; letter-spacing:-0.03em; }
.logo span { color:var(--rood); }
.header-badges { display:flex; gap:0.6rem; align-items:center; }
.badge-beta {
  font-family:'JetBrains Mono',monospace;
  font-size:0.65rem;
  padding:0.25rem 0.6rem;
  border-radius:4px;
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.6);
  border:1px solid rgba(255,255,255,0.15);
}
.btn-github {
  font-family:'JetBrains Mono',monospace;
  font-size:0.72rem;
  padding:0.4rem 0.9rem;
  border-radius:5px;
  background: rgba(255,255,255,0.08);
  color: var(--wit);
  border:1px solid rgba(255,255,255,0.2);
  text-decoration:none;
  transition:background 0.15s;
}
.btn-github:hover { background:rgba(255,255,255,0.15); }
.stats { display:flex; gap:2.5rem; flex-wrap:wrap; }
.stat { display:flex; flex-direction:column; gap:0.15rem; }
.stat-getal { font-size:1.8rem; font-weight:800; color:var(--wit); font-variant-numeric:tabular-nums; }
.stat-label { font-size:0.68rem; color:rgba(255,255,255,0.4); font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:0.06em; }

/* ── Sticky zoekbalk ── */
.zoek-sectie {
  position:sticky; top:0; z-index:100;
  background:var(--grijs);
  padding:1rem 2rem;
  border-bottom:1px solid var(--rand);
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
}
.zoek-inner { max-width:1200px; margin:0 auto; display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
.zoek-wrapper { flex:1; min-width:260px; position:relative; }
.zoek-icoon { position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--zacht); font-size:0.9rem; pointer-events:none; }
.zoek-veld {
  width:100%;
  padding:0.75rem 3rem 0.75rem 2.4rem;
  font-family:'Syne',sans-serif;
  font-size:0.95rem;
  border:2px solid var(--rand);
  border-radius:8px;
  background:var(--wit);
  outline:none;
  transition:border-color 0.15s, box-shadow 0.15s;
}
.zoek-veld:focus { border-color:var(--blauw); box-shadow:0 0 0 3px rgba(33,70,139,0.08); }
.zoek-hint {
  position:absolute; right:0.9rem; top:50%; transform:translateY(-50%);
  font-family:'JetBrains Mono',monospace; font-size:0.62rem;
  color:var(--zacht); background:var(--grijs); padding:0.15rem 0.4rem;
  border-radius:3px; border:1px solid var(--rand); pointer-events:none;
}
.filter-rij { display:flex; gap:0.4rem; flex-wrap:wrap; align-items:center; }
.filter-btn {
  padding:0.4rem 0.85rem;
  font-family:'JetBrains Mono',monospace; font-size:0.68rem;
  border:1.5px solid var(--rand); border-radius:5px;
  background:var(--wit); cursor:pointer;
  transition:all 0.12s; color:var(--zacht); white-space:nowrap;
}
.filter-btn:hover { border-color:var(--blauw); color:var(--blauw); }
.filter-btn.actief { background:var(--blauw); border-color:var(--blauw); color:var(--wit); }
.wis-btn {
  padding:0.4rem 0.7rem;
  font-family:'JetBrains Mono',monospace; font-size:0.68rem;
  border:1.5px dashed var(--rand); border-radius:5px;
  background:transparent; cursor:pointer; color:var(--zacht);
  transition:all 0.12s;
}
.wis-btn:hover { color:var(--rood); border-color:var(--rood); }

/* ── Resultaten ── */
.resultaten-sectie { max-width:1200px; margin:0 auto; padding:1.2rem 2rem 6rem; }
.resultaten-info {
  font-family:'JetBrains Mono',monospace; font-size:0.72rem;
  color:var(--zacht); margin-bottom:1rem;
  display:flex; justify-content:space-between; align-items:center;
}
.wet-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));
  gap:1px; background:var(--rand);
  border:1px solid var(--rand); border-radius:10px; overflow:hidden;
}
.wet-kaart {
  background:var(--wit); padding:1.2rem 1.4rem;
  text-decoration:none; color:inherit;
  transition:background 0.1s, transform 0.1s;
  display:flex; flex-direction:column; gap:0.5rem;
  position:relative;
}
.wet-kaart:hover { background:var(--kaart-hover); }
.wet-kaart:hover .wet-titel { color:var(--blauw); }
.wet-titel { font-size:0.88rem; font-weight:600; line-height:1.4; transition:color 0.1s; }
.wet-sub {
  display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;
  font-family:'JetBrains Mono',monospace; font-size:0.65rem; color:var(--zacht);
}
.wet-id { opacity:0.7; }
.wet-datum::before { content:'•'; margin-right:0.4rem; opacity:0.4; }
.wet-cat {
  font-family:'JetBrains Mono',monospace; font-size:0.62rem;
  padding:0.12rem 0.5rem; border-radius:3px;
  background:var(--grijs); border:1px solid var(--rand);
}
.wet-status {
  font-family:'JetBrains Mono',monospace; font-size:0.6rem;
  padding:0.1rem 0.4rem; border-radius:3px;
}
.status-geldig { background:#dcfce7; color:#166534; border:1px solid #bbf7d0; }
.status-ingetrokken { background:#fee2e2; color:#991b1b; border:1px solid #fecaca; }
.wet-voorstel-btn {
  position:absolute; right:1rem; top:50%; transform:translateY(-50%);
  font-family:'JetBrains Mono',monospace; font-size:0.6rem;
  padding:0.2rem 0.5rem; border-radius:3px;
  background:transparent; border:1px solid var(--rand);
  color:var(--zacht); opacity:0; transition:opacity 0.15s;
  text-decoration:none;
}
.wet-kaart:hover .wet-voorstel-btn { opacity:1; }

/* ── Meer laden ── */
.meer-laden {
  margin-top:1.5rem; text-align:center;
}
.meer-btn {
  padding:0.75rem 2rem;
  font-family:'Syne',sans-serif; font-weight:600; font-size:0.9rem;
  background:var(--donker); color:var(--wit);
  border:none; border-radius:8px; cursor:pointer;
  transition:background 0.15s;
}
.meer-btn:hover { background:#2a2a3f; }
.meer-info { font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--zacht); margin-top:0.5rem; }

/* ── Floating CTA ── */
.floating-cta {
  position:fixed; bottom:2rem; right:2rem; z-index:200;
  background:var(--oranje); color:var(--wit);
  padding:0.8rem 1.4rem;
  border-radius:50px;
  font-weight:700; font-size:0.85rem;
  text-decoration:none;
  box-shadow:0 4px 20px rgba(224,112,32,0.4);
  transition:transform 0.15s, box-shadow 0.15s;
  display:flex; align-items:center; gap:0.5rem;
}
.floating-cta:hover { transform:translateY(-2px); box-shadow:0 6px 24px rgba(224,112,32,0.5); }

/* ── Leeg / Laden ── */
.leeg, .laden {
  padding:4rem 2rem; text-align:center;
  font-family:'JetBrains Mono',monospace; font-size:0.82rem; color:var(--zacht);
}

/* ── Footer ── */
footer {
  padding:1.5rem 2rem; border-top:1px solid var(--rand);
  text-align:center;
  font-family:'JetBrains Mono',monospace; font-size:0.68rem; color:var(--zacht);
}
footer a { color:var(--blauw); text-decoration:none; }
footer a:hover { text-decoration:underline; }

/* ── Mobile ── */
@media (max-width: 640px) {
  header { padding:1.5rem 1rem 1.5rem; }
  .logo { font-size:1.7rem; }
  .zoek-sectie { padding:0.8rem 1rem; }
  .resultaten-sectie { padding:1rem 1rem 5rem; }
  .wet-grid { grid-template-columns:1fr; }
  .floating-cta { bottom:1rem; right:1rem; font-size:0.78rem; padding:0.7rem 1.1rem; }
  .stat-getal { font-size:1.4rem; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-top">
      <div class="logo">wetgeving<span>-nl</span></div>
      <div class="header-badges">
        <span class="badge-beta">beta</span>
        <a class="btn-github" href="https://github.com/Apolloccrypt/wetgeving-nl" target="_blank">GitHub</a>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="stat-getal" id="stat-wetten">—</span>
        <span class="stat-label">wetten geladen</span>
      </div>
      <div class="stat">
        <span class="stat-getal">21.407</span>
        <span class="stat-label">actuele regelingen</span>
      </div>
      <div class="stat">
        <span class="stat-getal">dagelijks</span>
        <span class="stat-label">bijgewerkt</span>
      </div>
    </div>
  </div>
</header>

<div class="zoek-sectie">
  <div class="zoek-inner">
    <div class="zoek-wrapper">
      <span class="zoek-icoon">&#9906;</span>
      <input class="zoek-veld" type="search" id="zoek"
        placeholder="Zoek op naam of BWBR-nummer..." autocomplete="off">
      <span class="zoek-hint">/ zoek</span>
    </div>
    <div class="filter-rij" id="filters"></div>
    <button class="wis-btn" id="wis-btn" onclick="wisFilters()" style="display:none">wis filters</button>
  </div>
</div>

<div class="resultaten-sectie">
  <div class="resultaten-info">
    <span id="info">Laden...</span>
  </div>
  <div id="resultaten"><div class="laden">Wetten ophalen van GitHub...</div></div>
  <div class="meer-laden" id="meer-laden" style="display:none">
    <button class="meer-btn" onclick="laadMeer()">Toon meer wetten</button>
    <div class="meer-info" id="meer-info"></div>
  </div>
</div>

<footer>
  <p>
    Data: <a href="https://wetten.overheid.nl">wetten.overheid.nl</a> (CC0) &nbsp;|&nbsp;
    Code: <a href="https://github.com/Apolloccrypt/wetgeving-nl">GitHub</a> (MIT) &nbsp;|&nbsp;
    <a href="https://github.com/Apolloccrypt/wetgeving-nl/tree/main/proposals">Wetsvoorstel indienen</a>
  </p>
  <p style="margin-top:0.4rem;opacity:0.5">Geen officiele band met de Nederlandse overheid.</p>
</footer>

<a class="floating-cta"
  href="https://github.com/Apolloccrypt/wetgeving-nl/issues/new?template=wetsvoorstel-idee.md"
  target="_blank">
  &#9998; Wetsvoorstel indienen
</a>

<script>
const GITHUB_API = 'https://api.github.com/repos/Apolloccrypt/wetgeving-nl/git/trees/main?recursive=1';
const PROPOSALS_URL = 'https://github.com/Apolloccrypt/wetgeving-nl/issues/new?template=wetsvoorstel-idee.md';
const BATCH = 100;

let alleWetten = [];
let gefilterdeWetten = [];
let getoondTot = BATCH;
let actieveFilter = 'alles';

const CATEGORIE_KLEUR = {
  'strafrecht':'#7f1d1d','burgerlijk-recht':'#1e3a5f','bestuursrecht':'#374151',
  'belastingrecht':'#78350f','arbeidsrecht':'#064e3b','sociaal-recht':'#1e3a5f',
  'gezondheidszorg':'#4c1d95','onderwijs':'#0c4a6e','milieu':'#14532d',
  'verkeer':'#7c2d12','digitaal':'#1e1b4b','internationaal-recht':'#312e81',
  'staatsinrichting':'#1f2937','financieel-recht':'#713f12','overig':'#6b7280',
};

function esc(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function categorieKleur(cat) {
  return CATEGORIE_KLEUR[cat] || '#6b7280';
}

async function laadWetten() {
  try {
    const r = await fetch(GITHUB_API);
    const data = await r.json();
    const bestanden = (data.tree||[]).filter(f =>
      f.path.startsWith('wetten/') && f.path.endsWith('.md')
    );
    alleWetten = bestanden.map(f => {
      const delen = f.path.split('/');
      const categorie = delen[1] || 'overig';
      const bestandsnaam = delen[2] || '';
      const naam = bestandsnaam.replace('.md','').replace(/-/g,' ')
        .replace(/\b\w/g, c => c.toUpperCase());
      const bwbr = bestandsnaam.replace('.md','').match(/bwbr?\d+/i);
      return {
        pad: f.path, naam, categorie,
        bwbr: bwbr ? bwbr[0].toUpperCase() : '',
        url: `https://github.com/Apolloccrypt/wetgeving-nl/blob/main/${f.path}`,
        voorstelUrl: PROPOSALS_URL,
      };
    });

    animeerGetal('stat-wetten', alleWetten.length);
    bouwFilters();
    filterEnToon();
  } catch(e) {
    document.getElementById('resultaten').innerHTML =
      '<div class="leeg">Kon wetten niet laden. Vernieuw de pagina.</div>';
  }
}

function animeerGetal(id, eindwaarde) {
  const el = document.getElementById(id);
  let huidig = 0;
  const stap = Math.ceil(eindwaarde / 60);
  const interval = setInterval(() => {
    huidig = Math.min(huidig + stap, eindwaarde);
    el.textContent = huidig.toLocaleString('nl-NL');
    if (huidig >= eindwaarde) clearInterval(interval);
  }, 20);
}

function bouwFilters() {
  const tellingen = {};
  alleWetten.forEach(w => { tellingen[w.categorie] = (tellingen[w.categorie]||0)+1; });
  const gesorteerd = Object.entries(tellingen).sort((a,b) => b[1]-a[1]);

  const container = document.getElementById('filters');
  container.innerHTML =
    `<button class="filter-btn ${actieveFilter==='alles'?'actief':''}" onclick="setFilter('alles')">alle (${alleWetten.length.toLocaleString('nl-NL')})</button>` +
    gesorteerd.map(([cat, n]) =>
      `<button class="filter-btn ${actieveFilter===cat?'actief':''}" onclick="setFilter('${cat}')">${cat} (${n.toLocaleString('nl-NL')})</button>`
    ).join('');
}

function setFilter(cat) {
  actieveFilter = cat;
  getoondTot = BATCH;
  document.getElementById('wis-btn').style.display =
    cat !== 'alles' ? 'block' : 'none';
  bouwFilters();
  filterEnToon();
}

function wisFilters() {
  setFilter('alles');
  document.getElementById('zoek').value = '';
}

function filterEnToon() {
  const zoekterm = document.getElementById('zoek').value.toLowerCase().trim();
  gefilterdeWetten = alleWetten.filter(w => {
    const filterOk = actieveFilter === 'alles' || w.categorie === actieveFilter;
    const zoekOk = !zoekterm ||
      w.naam.toLowerCase().includes(zoekterm) ||
      w.bwbr.toLowerCase().includes(zoekterm) ||
      w.pad.toLowerCase().includes(zoekterm);
    return filterOk && zoekOk;
  });

  toonResultaten();
}

function toonResultaten() {
  const totaal = gefilterdeWetten.length;
  const getoond = gefilterdeWetten.slice(0, getoondTot);

  document.getElementById('info').textContent =
    `${totaal.toLocaleString('nl-NL')} wetten${totaal < alleWetten.length ? ` van ${alleWetten.length.toLocaleString('nl-NL')}` : ''}`;

  if (totaal === 0) {
    document.getElementById('resultaten').innerHTML = '<div class="leeg">Geen wetten gevonden.</div>';
    document.getElementById('meer-laden').style.display = 'none';
    return;
  }

  document.getElementById('resultaten').innerHTML = `
    <div class="wet-grid">
      ${getoond.map(w => `
        <a class="wet-kaart" href="${w.url}" target="_blank" rel="noopener">
          <div class="wet-titel">${esc(w.naam)}</div>
          <div class="wet-sub">
            ${w.bwbr ? `<span class="wet-id">${w.bwbr}</span>` : ''}
            <span class="wet-cat" style="color:${categorieKleur(w.categorie)};border-color:${categorieKleur(w.categorie)}30">${w.categorie}</span>
            <span class="wet-status status-geldig">geldig</span>
          </div>
          <a class="wet-voorstel-btn" href="${w.voorstelUrl}" target="_blank" onclick="event.stopPropagation()">+ voorstel</a>
        </a>
      `).join('')}
    </div>`;

  const restant = totaal - getoondTot;
  const meerLaden = document.getElementById('meer-laden');
  if (restant > 0) {
    meerLaden.style.display = 'block';
    document.getElementById('meer-info').textContent =
      `${restant.toLocaleString('nl-NL')} wetten nog verborgen`;
  } else {
    meerLaden.style.display = 'none';
  }
}

function laadMeer() {
  getoondTot += BATCH;
  toonResultaten();
}

// Toetsenbord shortcut
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('zoek').focus();
  }
});

document.getElementById('zoek').addEventListener('input', () => {
  getoondTot = BATCH;
  filterEnToon();
});

laadWetten();
</script>
</body>
</html>
