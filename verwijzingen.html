<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wettengraaf — vrijewetgeving.nl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root {
  --rood:#AE1C28;--wit:#fff;--blauw:#21468B;--oranje:#FF6B00;
  --donker:#0a0a0f;--grijs:#f5f5f1;--tekst:#1a1a2e;--zacht:#6b7280;--rand:#e8e8e3;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Syne',sans-serif;background:var(--donker);color:var(--wit);height:100vh;overflow:hidden;display:flex;flex-direction:column;}

/* Header & nav */
header{background:var(--donker);padding:1rem 1.5rem;position:relative;flex-shrink:0;}
header::before{content:'';position:absolute;top:0;left:0;right:0;height:8px;
  background:linear-gradient(180deg,var(--rood) 33%,var(--wit) 33%,var(--wit) 66%,var(--blauw) 66%);}
.header-inner{display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:1.2rem;font-weight:800;text-decoration:none;color:var(--wit);}
.logo span{color:var(--oranje);}
.nav-bar{background:var(--donker);border-bottom:1px solid rgba(255,255,255,0.08);padding:0 1.5rem;flex-shrink:0;}
.nav-inner{display:flex;gap:0;overflow-x:auto;}
.nav-btn{font-family:'JetBrains Mono',monospace;font-size:0.7rem;padding:0.6rem 1rem;
  color:rgba(255,255,255,0.4);text-decoration:none;white-space:nowrap;
  border-bottom:2px solid transparent;transition:all 0.15s;}
.nav-btn:hover{color:var(--wit);}
.nav-btn.actief{color:var(--oranje);border-bottom-color:var(--oranje);}

/* Toolbar */
.toolbar{background:rgba(10,10,15,0.9);border-bottom:1px solid rgba(255,255,255,0.08);
  padding:0.6rem 1.5rem;display:flex;gap:0.6rem;align-items:center;flex-shrink:0;flex-wrap:wrap;}

/* Modus knoppen */
.modus-groep{display:flex;gap:0.3rem;background:rgba(255,255,255,0.05);border-radius:6px;padding:3px;}
.modus-btn{padding:0.35rem 0.75rem;border:none;border-radius:4px;
  font-family:'JetBrains Mono',monospace;font-size:0.68rem;cursor:pointer;
  background:transparent;color:rgba(255,255,255,0.45);transition:all 0.15s;}
.modus-btn:hover{color:var(--wit);}
.modus-btn.actief{background:var(--oranje);color:var(--wit);}

/* Zoek wrapper */
.zoek-wrap{position:relative;flex:1;max-width:340px;}
.zoek-input{width:100%;padding:0.5rem 0.85rem;font-family:'JetBrains Mono',monospace;font-size:0.8rem;
  background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.12);
  border-radius:6px;color:var(--wit);outline:none;transition:border-color 0.15s;}
.zoek-input::placeholder{color:rgba(255,255,255,0.25);}
.zoek-input:focus{border-color:var(--oranje);}
.ac-lijst{position:absolute;top:100%;left:0;right:0;
  background:rgba(12,12,18,0.98);border:1px solid rgba(255,255,255,0.12);
  border-top:none;border-radius:0 0 8px 8px;z-index:300;display:none;max-height:260px;overflow-y:auto;}
.ac-lijst.open{display:block;}
.ac-item{padding:0.55rem 0.85rem;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04);}
.ac-item:hover,.ac-item.hl{background:rgba(255,107,0,0.12);}
.ac-titel{font-size:0.78rem;color:var(--wit);}
.ac-titel mark{background:transparent;color:var(--oranje);font-weight:700;}
.ac-sub{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:rgba(255,255,255,0.3);margin-top:2px;}

/* Diepte & acties */
.tb-label{font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:rgba(255,255,255,0.35);}
.d-btn{width:28px;height:28px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:0.72rem;
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);
  color:rgba(255,255,255,0.5);cursor:pointer;transition:all 0.12s;}
.d-btn:hover{border-color:var(--oranje);color:var(--oranje);}
.d-btn.actief{background:var(--oranje);border-color:var(--oranje);color:var(--wit);}
.tb-actie{padding:0.35rem 0.75rem;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:0.65rem;
  background:transparent;border:1px solid rgba(255,255,255,0.15);
  color:rgba(255,255,255,0.45);cursor:pointer;transition:all 0.12s;}
.tb-actie:hover{border-color:rgba(255,255,255,0.4);color:var(--wit);}
.tb-actie.rood:hover{border-color:#f87171;color:#f87171;}
.telling{font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:rgba(255,255,255,0.25);margin-left:auto;}

/* Canvas */
.canvas{flex:1;position:relative;overflow:hidden;}
#graaf{width:100%;height:100%;}

/* Context menu */
.ctx-menu{position:fixed;background:rgba(12,12,18,0.98);border:1px solid rgba(255,255,255,0.15);
  border-radius:8px;padding:0.4rem;z-index:500;display:none;min-width:180px;}
.ctx-menu.open{display:block;}
.ctx-item{padding:0.45rem 0.75rem;border-radius:4px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:rgba(255,255,255,0.7);
  transition:background 0.1s;display:flex;align-items:center;gap:0.5rem;}
.ctx-item:hover{background:rgba(255,107,0,0.15);color:var(--wit);}
.ctx-item.gevaar:hover{background:rgba(248,113,113,0.15);color:#f87171;}
.ctx-sep{height:1px;background:rgba(255,255,255,0.08);margin:0.3rem 0;}

/* Info paneel */
.info{position:absolute;right:1rem;top:1rem;width:270px;
  background:rgba(10,10,15,0.96);border:1px solid rgba(255,255,255,0.12);
  border-radius:10px;padding:1rem;display:none;backdrop-filter:blur(12px);}
.info.open{display:block;}
.info-sluit{position:absolute;right:0.7rem;top:0.7rem;background:none;border:none;
  color:rgba(255,255,255,0.3);cursor:pointer;font-size:1rem;}
.info-sluit:hover{color:var(--wit);}
.info-h{font-size:0.85rem;font-weight:700;line-height:1.4;margin-bottom:0.25rem;padding-right:1.5rem;}
.info-id{font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:rgba(255,255,255,0.35);margin-bottom:0.7rem;}
.info-stat{display:flex;gap:1rem;margin-bottom:0.8rem;}
.info-s{text-align:center;}
.info-s .n{font-size:1.2rem;font-weight:700;color:var(--oranje);}
.info-s .l{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:rgba(255,255,255,0.35);}
.info-acties{display:flex;flex-direction:column;gap:0.35rem;}
.info-btn{padding:0.4rem 0.7rem;border-radius:5px;font-family:'JetBrains Mono',monospace;
  font-size:0.65rem;text-decoration:none;text-align:center;cursor:pointer;
  border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.6);
  background:transparent;transition:all 0.12s;display:block;}
.info-btn:hover{border-color:var(--oranje);color:var(--oranje);}
.info-btn.prim{background:var(--oranje);border-color:var(--oranje);color:var(--wit);}
.info-btn.prim:hover{background:#e05500;}

/* Legenda */
.legenda{position:absolute;right:1rem;bottom:1rem;
  background:rgba(10,10,15,0.8);border:1px solid rgba(255,255,255,0.08);
  border-radius:8px;padding:0.7rem 0.9rem;font-family:'JetBrains Mono',monospace;font-size:0.62rem;}
.leg{display:flex;align-items:center;gap:0.45rem;margin-bottom:0.3rem;color:rgba(255,255,255,0.45);}
.leg:last-child{margin-bottom:0;}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

/* Tooltip */
.tt{position:fixed;background:rgba(10,10,15,0.95);border:1px solid rgba(255,255,255,0.1);
  color:var(--wit);padding:0.5rem 0.8rem;border-radius:6px;
  font-family:'JetBrains Mono',monospace;font-size:0.68rem;
  pointer-events:none;opacity:0;transition:opacity 0.1s;z-index:200;max-width:260px;line-height:1.5;}

/* Entiteit chips */
.entiteit-chips{display:flex;gap:0.4rem;flex-wrap:wrap;margin-top:0.4rem;}
.entiteit-chip{padding:0.25rem 0.65rem;border-radius:20px;
  font-family:'JetBrains Mono',monospace;font-size:0.65rem;cursor:pointer;
  border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);
  transition:all 0.12s;}
.entiteit-chip:hover{border-color:var(--oranje);color:var(--oranje);}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">vrije<span>wetgeving.nl</span></a>
  </div>
</header>

<nav class="nav-bar">
  <div class="nav-inner">
    <a class="nav-btn" href="index.html">Alle wetten</a>
    <a class="nav-btn" href="bevoegdheden.html">Bevoegdhedencheck</a>
    <a class="nav-btn actief" href="verwijzingen.html">Wettengraaf</a>
    <a class="nav-btn" href="rechten.html">Mijn rechten</a>
    <div class="nav-spacer"></div>
    <div class="nav-dropdown-wrap">
      <button class="nav-dropdown-btn">GitHub ▾</button>
      <div class="nav-dropdown">
        <a href="https://github.com/Apolloccrypt/wetgeving-nl" target="_blank">Repository</a>
        <a href="https://github.com/Apolloccrypt/wetgeving-nl/tree/main/proposals" target="_blank">Wetsvoorstellen indienen</a>
        <a href="https://github.com/Apolloccrypt/wetgeving-nl/discussions" target="_blank">Discussie</a>
        <a href="https://github.com/Apolloccrypt/wetgeving-nl/issues" target="_blank">Issues & fouten</a>
      </div>
    </div>
  </div>
</nav>

<div class="toolbar">
  <!-- Modus -->
  <div class="modus-groep">
    <button class="modus-btn actief" id="m-wet" onclick="setModus('wet')">Wet zoeken</button>
    <button class="modus-btn" id="m-entiteit" onclick="setModus('entiteit')">Begrip / entiteit</button>
  </div>

  <!-- Zoek -->
  <div class="zoek-wrap">
    <input class="zoek-input" id="zoek" type="search" placeholder="Zoek een wet of begrip..."
      oninput="acZoek()" onkeydown="acKey(event)" autocomplete="off">
    <div class="ac-lijst" id="ac"></div>
  </div>

  <span class="tb-label">Diepte:</span>
  <button class="d-btn actief" id="d1" onclick="setDiepte(1)">1</button>
  <button class="d-btn" id="d2" onclick="setDiepte(2)">2</button>
  <button class="d-btn" id="d3" onclick="setDiepte(3)">3</button>
  <button class="tb-actie" onclick="allesVerwijderen()">Leeg</button>
  <button class="tb-actie" onclick="resetView()">Reset view</button>
  <span class="telling" id="telling"></span>
</div>

<div class="canvas">
  <svg id="graaf"></svg>
  <div class="tt" id="tt"></div>

  <div class="info" id="info">
    <button class="info-sluit" onclick="sluitInfo()">×</button>
    <div class="info-h" id="info-h"></div>
    <div class="info-id" id="info-id"></div>
    <div class="info-stat" id="info-stat"></div>
    <div class="info-acties" id="info-acties"></div>
  </div>

  <div class="legenda">
    <div class="leg"><div class="leg-dot" style="background:#FF6B00"></div>Geselecteerd / centrum</div>
    <div class="leg"><div class="leg-dot" style="background:#60a5fa"></div>Verwijst naar</div>
    <div class="leg"><div class="leg-dot" style="background:#a78bfa"></div>Verwijst terug</div>
    <div class="leg"><div class="leg-dot" style="background:#4ade80"></div>Diepte 2+</div>
  </div>
</div>

<!-- Context menu -->
<div class="ctx-menu" id="ctx">
  <div class="ctx-item" id="ctx-centreer" onclick="ctxCentreer()">↯ Centreer in graaf</div>
  <div class="ctx-item" id="ctx-uitbreid" onclick="ctxUitbreid()">＋ Uitbreiden</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" id="ctx-wet" onclick="ctxOpenWet()">↗ Bekijk wet</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item gevaar" onclick="ctxVerwijder()">✕ Verwijder uit graaf</div>
</div>

<script>
const GITHUB = 'https://github.com/Apolloccrypt/wetgeving-nl/blob/main/';

// Entiteiten: begrippen die naar relevante wetten leiden
const ENTITEITEN = [
  { label:'Huurrecht',       termen:['huur','woonruimte','huurprijzen'] },
  { label:'Privacy & AVG',   termen:['persoonsgegevens','avg','gegevensbescherming'] },
  { label:'Arbeidsrecht',    termen:['arbeidsovereenkomst','arbeidsrecht','cao '] },
  { label:'Strafrecht',      termen:['wetboek van strafrecht','strafvordering','delict'] },
  { label:'Bestuursrecht',   termen:['algemene wet bestuursrecht','awb','bezwaar'] },
  { label:'Belasting',       termen:['inkomstenbelasting','omzetbelasting','belastingwet'] },
  { label:'Zorg',            termen:['wgbo','zorgverzekering','wlz','wmo'] },
  { label:'Onderwijs',       termen:['leerplicht','studiefinanciering','onderwijswet'] },
  { label:'Milieu',          termen:['milieuwet','waterwet','omgevingswet'] },
  { label:'Faillissement',   termen:['faillissement','surseance','insolventie'] },
];

let indexData = [];
let verwData  = {};
let bwbrMap   = {};
let modus     = 'wet';
let diepte    = 1;
let sim       = null;
let acIdx     = -1;
let ctxNode   = null;

// Graaf state
let grNodes = new Map(); // id -> node obj
let grLinks = [];

async function init() {
  const [idx, verw] = await Promise.all([
    fetch('index.json').then(r => r.json()),
    fetch('verwijzingen.json').then(r => r.json()).catch(() => ({})),
  ]);
  indexData = idx;
  verwData  = verw;
  indexData.forEach((w, i) => { if (w.identifier) bwbrMap[w.identifier] = i; });
  initGraaf();
  // Start met populairste wet
  const top = Object.entries(verwData).sort((a,b) => b[1].length - a[1].length)[0];
  if (top) voegWetToe(indexData[bwbrMap[top[0]]], 0);
}

// ── Modus ────────────────────────────────────────────────────────────────

function setModus(m) {
  modus = m;
  document.querySelectorAll('.modus-btn').forEach(b => b.classList.remove('actief'));
  document.getElementById('m-' + m).classList.add('actief');
  document.getElementById('zoek').placeholder =
    m === 'wet' ? 'Zoek een wet...' : 'Zoek een begrip (bijv. huurrecht, privacy)...';
  document.getElementById('zoek').value = '';
  document.getElementById('ac').className = 'ac-lijst';
}

// ── Diepte ───────────────────────────────────────────────────────────────

function setDiepte(d) {
  diepte = d;
  document.querySelectorAll('.d-btn').forEach(b => b.classList.remove('actief'));
  document.getElementById('d' + d).classList.add('actief');
}

// ── Autocomplete ─────────────────────────────────────────────────────────

function acZoek() {
  const q = document.getElementById('zoek').value.toLowerCase().trim();
  const ac = document.getElementById('ac');
  acIdx = -1;
  if (q.length < 2) { ac.className = 'ac-lijst'; return; }

  let hits = [];

  if (modus === 'wet') {
    hits = indexData
      .filter(w => (w.titel||'').toLowerCase().includes(q) && verwData[w.identifier])
      .sort((a,b) => (verwData[b.identifier]||[]).length - (verwData[a.identifier]||[]).length)
      .slice(0, 8)
      .map(w => ({
        label: w.titel,
        sub: `${w.identifier} · ${(verwData[w.identifier]||[]).length} verwijzingen`,
        action: () => voegWetToe(w, 0),
      }));
  } else {
    // Entiteiten + vrije zoekterm
    const entHits = ENTITEITEN.filter(e => e.label.toLowerCase().includes(q));
    hits = entHits.map(e => ({
      label: e.label,
      sub: `begrip · klik om gerelateerde wetten te laden`,
      action: () => laadEntiteit(e),
    }));
    if (hits.length < 3) {
      // Voeg ook directe wet-hits toe
      indexData
        .filter(w => (w.titel||'').toLowerCase().includes(q))
        .slice(0, 5 - hits.length)
        .forEach(w => hits.push({
          label: w.titel,
          sub: w.identifier,
          action: () => voegWetToe(w, 0),
        }));
    }
  }

  if (!hits.length) { ac.className = 'ac-lijst'; return; }
  ac.innerHTML = hits.map((h, i) => `
    <div class="ac-item" onclick="kiesAC(${i})">
      <div class="ac-titel">${h.label.replace(new RegExp(q,'gi'), m => `<mark>${m}</mark>`)}</div>
      <div class="ac-sub">${h.sub}</div>
    </div>`).join('');
  ac.__hits = hits;
  ac.className = 'ac-lijst open';
}

function kiesAC(i) {
  const ac = document.getElementById('ac');
  const hit = ac.__hits[i];
  if (hit) { hit.action(); document.getElementById('zoek').value = ''; }
  ac.className = 'ac-lijst';
}

function acKey(e) {
  const ac = document.getElementById('ac');
  const items = ac.querySelectorAll('.ac-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); acIdx = Math.min(acIdx+1, items.length-1); items.forEach((el,i) => el.classList.toggle('hl', i===acIdx)); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); acIdx = Math.max(acIdx-1, -1); items.forEach((el,i) => el.classList.toggle('hl', i===acIdx)); }
  else if (e.key === 'Enter' && acIdx >= 0) { items[acIdx]?.click(); }
  else if (e.key === 'Escape') { ac.className = 'ac-lijst'; }
}

document.addEventListener('click', e => {
  if (!e.target.closest('.zoek-wrap')) document.getElementById('ac').className = 'ac-lijst';
  if (!e.target.closest('.ctx-menu')) sluitCtx();
});

// ── Entiteiten ────────────────────────────────────────────────────────────

function laadEntiteit(entiteit) {
  allesVerwijderen();
  const termen = entiteit.termen.map(t => t.toLowerCase());
  const wetten = indexData
    .filter(w => termen.some(t => (w.titel||'').toLowerCase().includes(t)) && verwData[w.identifier])
    .sort((a,b) => (verwData[b.identifier]||[]).length - (verwData[a.identifier]||[]).length)
    .slice(0, 8);
  wetten.forEach((w, i) => voegWetToe(w, i === 0 ? 0 : 1, false));
  hertekenGraaf();
}

// ── Graaf core ────────────────────────────────────────────────────────────

function voegWetToe(wet, niveau, herteken = true) {
  if (!wet?.identifier) return;
  if (grNodes.has(wet.identifier)) {
    toonInfo(wet); return;
  }
  grNodes.set(wet.identifier, {
    id: wet.identifier, titel: wet.titel,
    categorie: wet.categorie, pad: wet.pad,
    niveau, x: undefined, y: undefined,
  });

  // Voeg verwijzingen toe tot diepte
  function uitbreid(id, huidigNiveau) {
    if (huidigNiveau >= diepte) return;
    (verwData[id] || []).slice(0, 10).forEach(refId => {
      if (!grNodes.has(refId) && bwbrMap[refId] !== undefined) {
        const w = indexData[bwbrMap[refId]];
        grNodes.set(refId, { id: refId, titel: w.titel, categorie: w.categorie, pad: w.pad, niveau: huidigNiveau+1 });
        uitbreid(refId, huidigNiveau+1);
      }
    });
  }
  uitbreid(wet.identifier, niveau);
  herbouwLinks();
  if (herteken) hertekenGraaf();
  toonInfo(wet);
}

function herbouwLinks() {
  grLinks = [];
  grNodes.forEach((node, id) => {
    (verwData[id] || []).forEach(refId => {
      if (grNodes.has(refId)) {
        grLinks.push({ source: id, target: refId });
      }
    });
  });
}

function verwijderNode(id) {
  grNodes.delete(id);
  herbouwLinks();
  hertekenGraaf();
  sluitInfo();
}

function allesVerwijderen() {
  grNodes.clear(); grLinks = [];
  hertekenGraaf(); sluitInfo();
}

// ── D3 graaf ──────────────────────────────────────────────────────────────

let svgEl, gEl, zoomBehavior;

function initGraaf() {
  svgEl = d3.select('#graaf');
  gEl   = svgEl.append('g');
  zoomBehavior = d3.zoom().scaleExtent([0.1, 5]).on('zoom', e => gEl.attr('transform', e.transform));
  svgEl.call(zoomBehavior);
  svgEl.append('defs').selectAll('marker').data(['to','from']).join('marker')
    .attr('id', d => 'arr-'+d).attr('viewBox','0 -4 8 8').attr('refX',20).attr('refY',0)
    .attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto')
    .append('path').attr('d','M0,-4L8,0L0,4')
    .attr('fill', d => d==='to' ? '#60a5fa30' : '#a78bfa30');
}

function resetView() {
  svgEl.transition().duration(400).call(zoomBehavior.transform, d3.zoomIdentity);
}

const KLEUR = id => {
  const n = grNodes.get(id);
  if (!n) return '#6b7280';
  if (n.niveau === 0) return '#FF6B00';
  return n.niveau === 1 ? '#60a5fa' : '#4ade80';
};

function hertekenGraaf() {
  if (!gEl) return;
  gEl.selectAll('*').remove();
  if (sim) sim.stop();

  const nodes = Array.from(grNodes.values());
  const links = grLinks.map(l => ({...l}));

  document.getElementById('telling').textContent =
    `${nodes.length} wetten · ${links.length} verbindingen`;

  if (!nodes.length) return;

  const W = document.querySelector('.canvas').clientWidth;
  const H = document.querySelector('.canvas').clientHeight;

  sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(110).strength(0.5))
    .force('charge', d3.forceManyBody().strength(-300))
    .force('center', d3.forceCenter(W/2, H/2))
    .force('collision', d3.forceCollide(42));

  const link = gEl.append('g').selectAll('line').data(links).join('line')
    .attr('stroke', l => {
      const src = typeof l.source === 'object' ? l.source.id : l.source;
      const tgt = typeof l.target === 'object' ? l.target.id : l.target;
      if (verwData[tgt]?.includes(src)) return '#a78bfa40';
      return '#60a5fa30';
    })
    .attr('stroke-width', 1.5)
    .attr('marker-end', 'url(#arr-to)');

  const node = gEl.append('g').selectAll('g').data(nodes).join('g')
    .style('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (e,d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag',  (e,d) => { d.fx=e.x; d.fy=e.y; })
      .on('end',   (e,d) => { if (!e.active) sim.alphaTarget(0); })
    )
    .on('click', (e,d) => { e.stopPropagation(); toonInfo(indexData[bwbrMap[d.id]]); })
    .on('dblclick', (e,d) => { e.stopPropagation(); uitbreidNode(d.id); })
    .on('contextmenu', (e,d) => { e.preventDefault(); openCtx(e, d); })
    .on('mouseover', (e,d) => {
      const tt = document.getElementById('tt');
      const verw = (verwData[d.id]||[]).length;
      tt.innerHTML = `<strong>${d.titel}</strong><br><span style="opacity:.5">${d.id}</span><br><span style="color:var(--oranje)">${verw} verwijzingen</span><br><em style="opacity:.4">Dubbelklik om uit te breiden · Rechtsklik voor opties</em>`;
      tt.style.opacity = '1';
    })
    .on('mousemove', e => {
      const tt = document.getElementById('tt');
      tt.style.left = (e.clientX+14)+'px'; tt.style.top = (e.clientY-40)+'px';
    })
    .on('mouseout', () => document.getElementById('tt').style.opacity = '0');

  const radius = d => d.niveau === 0 ? 18 : d.niveau === 1 ? 12 : 8;

  node.append('circle')
    .attr('r', radius)
    .attr('fill', d => KLEUR(d.id))
    .attr('fill-opacity', d => d.niveau === 0 ? 1 : 0.75)
    .attr('stroke', d => d.niveau === 0 ? 'rgba(255,255,255,0.3)' : 'none')
    .attr('stroke-width', 2);

  node.append('text')
    .attr('text-anchor', 'middle')
    .attr('dy', d => radius(d) + 13)
    .attr('font-size', d => d.niveau === 0 ? '10px' : '8.5px')
    .attr('font-family', 'JetBrains Mono, monospace')
    .attr('fill', 'rgba(255,255,255,0.55)')
    .text(d => { const max = d.niveau===0?38:30; return d.titel.length>max ? d.titel.substring(0,max-1)+'…' : d.titel; });

  sim.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

function uitbreidNode(id) {
  const w = indexData[bwbrMap[id]];
  if (!w) return;
  const node = grNodes.get(id);
  if (!node) return;
  (verwData[id]||[]).slice(0, 12).forEach(refId => {
    if (!grNodes.has(refId) && bwbrMap[refId] !== undefined) {
      const rw = indexData[bwbrMap[refId]];
      grNodes.set(refId, { id: refId, titel: rw.titel, categorie: rw.categorie, pad: rw.pad, niveau: node.niveau+1 });
    }
  });
  herbouwLinks();
  hertekenGraaf();
}

// ── Context menu ──────────────────────────────────────────────────────────

function openCtx(e, d) {
  ctxNode = d;
  const m = document.getElementById('ctx');
  m.style.left = e.clientX+'px'; m.style.top = e.clientY+'px';
  m.className = 'ctx-menu open';
}
function sluitCtx() { document.getElementById('ctx').className = 'ctx-menu'; }
function ctxCentreer() { if (ctxNode) { const w = indexData[bwbrMap[ctxNode.id]]; if (w) { allesVerwijderen(); voegWetToe(w,0); } } sluitCtx(); }
function ctxUitbreid() { if (ctxNode) uitbreidNode(ctxNode.id); sluitCtx(); }
function ctxOpenWet() { if (ctxNode) { const w = indexData[bwbrMap[ctxNode.id]]; if (w) window.open(GITHUB+w.pad,'_blank'); } sluitCtx(); }
function ctxVerwijder() { if (ctxNode) verwijderNode(ctxNode.id); sluitCtx(); }

// ── Info paneel ───────────────────────────────────────────────────────────

function toonInfo(wet) {
  if (!wet) return;
  const aantalVerw    = (verwData[wet.identifier]||[]).length;
  const aantalVanuit  = Object.values(verwData).filter(v => v.includes(wet.identifier)).length;

  document.getElementById('info-h').textContent = wet.titel;
  document.getElementById('info-id').textContent = `${wet.identifier} · ${wet.categorie}`;
  document.getElementById('info-stat').innerHTML = `
    <div class="info-s"><div class="n">${aantalVerw}</div><div class="l">verwijst naar</div></div>
    <div class="info-s"><div class="n">${aantalVanuit}</div><div class="l">verwezen door</div></div>`;
  document.getElementById('info-acties').innerHTML = `
    <button class="info-btn" onclick="uitbreidNode('${wet.identifier}')">＋ Uitbreiden in graaf</button>
    <button class="info-btn" onclick="allesVerwijderen();voegWetToe(indexData[bwbrMap['${wet.identifier}']],0)">↯ Centreer in graaf</button>
    <a class="info-btn prim" href="${GITHUB}${wet.pad}" target="_blank">Bekijk wet ↗</a>
    <a class="info-btn" href="https://wetten.overheid.nl/${wet.identifier}" target="_blank">wetten.overheid.nl ↗</a>
    <button class="info-btn" style="color:#f87171;border-color:#f87171;margin-top:0.2rem" onclick="verwijderNode('${wet.identifier}')">✕ Verwijder uit graaf</button>`;
  document.getElementById('info').className = 'info open';
}

function sluitInfo() { document.getElementById('info').className = 'info'; }

init();
</script>
</body>
</html>
