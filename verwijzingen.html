<head>

<style>

  --rood:#AE1C28; --wit:#ffffff; --blauw:#21468B; --oranje:#FF6B00;
  --donker:#0a0a0f; --grijs:#f5f5f1; --tekst:#1a1a2e; --zacht:#6b7280; --rand:#e8e8e3;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Syne',sans-serif; background:var(--grijs); color:var(--tekst); min-height:100vh; }

header { background:var(--donker); color:var(--wit); padding:1.5rem 2rem; position:relative; }
header::before { content:''; position:absolute; top:0; left:0; right:0; height:10px;
  background:linear-gradient(180deg,var(--rood) 33%,var(--wit) 33%,var(--wit) 66%,var(--blauw) 66%); }
header::after { content:''; position:absolute; bottom:0; left:0; right:0; height:10px;
  background:linear-gradient(180deg,var(--rood) 33%,var(--wit) 33%,var(--wit) 66%,var(--blauw) 66%); }
.header-inner { max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; }
.logo { font-size:1.4rem; font-weight:800; text-decoration:none; color:var(--wit); }
.logo span { color:var(--oranje); }

.nav-bar { background:var(--donker); border-top:1px solid rgba(255,255,255,0.06); padding:0 2rem; }
.nav-inner { max-width:1200px; margin:0 auto; display:flex; gap:0; overflow-x:auto; }
.nav-btn { font-family:'JetBrains Mono',monospace; font-size:0.72rem; padding:0.7rem 1.1rem;
  color:rgba(255,255,255,0.45); text-decoration:none; white-space:nowrap;
  border-bottom:2px solid transparent; transition:all 0.15s; }
.nav-btn:hover { color:var(--wit); }
.nav-btn.actief { color:var(--oranje); border-bottom-color:var(--oranje); }

footer { text-align:center; padding:1.5rem; font-family:'JetBrains Mono',monospace;
  font-size:0.68rem; color:var(--zacht); border-top:1px solid var(--rand); background:var(--wit); margin-top:4rem; }
footer a { color:var(--blauw); text-decoration:none; }








.
.logo { font-size:1.4rem; font-weight:800; text-decoration:none; color:var(--wit); }
.logo span { color:var(--oranje); }







.controls {
  background:var(--wit); border-bottom:1px solid var(--rand);
  padding:1rem 2rem;
}
.controls-inner { max-width:1200px; margin:0 auto; display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
.zoek-input {
  flex:1; min-width:200px; padding:0.6rem 0.9rem;
  font-family:'Syne',sans-serif; font-size:0.9rem;
  border:2px solid var(--rand); border-radius:6px; outline:none;
}
.zoek-input:focus { border-color:var(--oranje); }
.ctrl-btn {
  padding:0.6rem 1rem; font-family:'JetBrains Mono',monospace; font-size:0.72rem;
  border:1.5px solid var(--rand); border-radius:5px; background:var(--grijs);
  cursor:pointer; color:var(--tekst); transition:all 0.12s; white-space:nowrap;
}
.ctrl-btn:hover { border-color:var(--oranje); color:var(--oranje); }
.ctrl-btn.actief { background:var(--oranje); border-color:var(--oranje); color:var(--wit); }
.diepte-label { font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:var(--zacht); }

.graaf-container { position:relative; width:100%; height:calc(100vh - 200px); min-height:500px; }
#graaf { width:100%; height:100%; }

.tooltip {
  position:absolute; background:var(--donker); color:var(--wit);
  padding:0.6rem 0.9rem; border-radius:6px; font-family:'JetBrains Mono',monospace;
  font-size:0.72rem; pointer-events:none; opacity:0; transition:opacity 0.15s;
  max-width:280px; line-height:1.5; z-index:100;
}

.info-paneel {
  position:absolute; right:1rem; top:1rem;
  background:var(--wit); border:1px solid var(--rand); border-radius:8px;
  padding:1rem; max-width:280px; font-size:0.8rem;
  box-shadow:0 4px 16px rgba(0,0,0,0.08); display:none;
}
.info-paneel.open { display:block; }
.info-titel { font-weight:700; margin-bottom:0.4rem; font-size:0.88rem; }
.info-ident { font-family:'JetBrains Mono',monospace; font-size:0.68rem; color:var(--zacht); margin-bottom:0.6rem; }
.info-links a { display:block; font-family:'JetBrains Mono',monospace; font-size:0.68rem;
  color:var(--blauw); text-decoration:none; margin-top:0.3rem; }
.info-links a:hover { text-decoration:underline; }
.info-sluiten { position:absolute; right:0.7rem; top:0.7rem; cursor:pointer;
  font-size:1rem; color:var(--zacht); background:none; border:none; }

.laden { display:flex; align-items:center; justify-content:center; height:400px;
  font-family:'JetBrains Mono',monospace; font-size:0.85rem; color:var(--zacht); }

.legenda {
  position:absolute; left:1rem; bottom:1rem;
  background:rgba(255,255,255,0.9); border:1px solid var(--rand);
  border-radius:6px; padding:0.7rem; font-family:'JetBrains Mono',monospace; font-size:0.65rem;
}
.leg-item { display:flex; align-items:center; gap:0.4rem; margin-bottom:0.3rem; }
.leg-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">vrije<span>wetgeving.nl</span></a>
  </div>
</header>
<nav class="nav-bar">
  <div class="nav-inner">
    <a class="nav-btn" href="index.html">Alle wetten</a>
    <a class="nav-btn" href="bevoegdheden.html">Bevoegdhedencheck</a>
    <a class="nav-btn actief" href="verwijzingen.html">Verwijzingen-graaf</a>
    <a class="nav-btn" href="rechten.html">Mijn rechten</a>
    <a class="nav-btn" href="https://github.com/Apolloccrypt/wetgeving-nl/tree/main/proposals" target="_blank">Wetsvoorstellen</a>
    <a class="nav-btn" href="https://github.com/Apolloccrypt/wetgeving-nl/discussions" target="_blank">Discussie</a>
    <a class="nav-btn" href="https://github.com/Apolloccrypt/wetgeving-nl" target="_blank">GitHub</a>
  </div>
</nav>

<div class="controls">
  <div class="controls-inner">
    <input class="zoek-input" id="zoek" type="search" placeholder="Zoek een wet (bijv. AVG, Strafrecht, Burgerlijk Wetboek)..." oninput="filterNaam()">
    <span class="diepte-label">Diepte:</span>
    <button class="ctrl-btn actief" id="d1" onclick="setDiepte(1)">1</button>
    <button class="ctrl-btn" id="d2" onclick="setDiepte(2)">2</button>
    <button class="ctrl-btn" id="d3" onclick="setDiepte(3)">3</button>
    <button class="ctrl-btn" onclick="resetGraaf()">Reset</button>
  </div>
</div>

<div class="graaf-container">
  <div class="laden" id="laden">Verwijzingen laden...</div>
  <svg id="graaf"></svg>
  <div class="tooltip" id="tooltip"></div>
  <div class="info-paneel" id="info-paneel">
    <button class="info-sluiten" onclick="sluitInfo()">x</button>
    <div class="info-titel" id="info-titel"></div>
    <div class="info-ident" id="info-ident"></div>
    <div class="info-links" id="info-links"></div>
  </div>
  <div class="legenda">
    <div class="leg-item"><div class="leg-dot" style="background:#FF6B00"></div> Geselecteerde wet</div>
    <div class="leg-item"><div class="leg-dot" style="background:#21468B"></div> Verwijst naar</div>
    <div class="leg-item"><div class="leg-dot" style="background:#16a34a"></div> Wordt verwezen door</div>
  </div>
</div>

<script>
const GITHUB_BASE = 'https://github.com/Apolloccrypt/wetgeving-nl/blob/main/';
let indexData = [];
let huidigeDiepte = 1;
let geselecteerd = null;
let simulatie = null;

async function laadData() {
  try {
    const r = await fetch('index.json');
    indexData = await r.json();

    // Bouw verwijzingen-map uit identifiers in de titels en pads
    // Gebruik de BWBR nummers als lookup
    bwbrNaarWet = {};
    indexData.forEach(w => {
      if (w.identifier) bwbrNaarWet[w.identifier] = w;
    });

    document.getElementById('laden').style.display = 'none';
    toonStartscherm();
  } catch(e) {
    document.getElementById('laden').textContent = 'Fout bij laden. Vernieuw de pagina.';
  }
}

let bwbrNaarWet = {};

function toonStartscherm() {
  // Toon top-20 meest verwezen wetten als startpunt
  const bekende = [
    'BWBR0005537', // Awb
    'BWBR0001854', // Strafrecht
    'BWBR0002656', // BW Boek 1
    'BWBR0040940', // AVG uitvoering
    'BWBR0006229', // Gemeentewet
  ];
  const startWet = bwbrNaarWet[bekende[0]];
  if (startWet) toonGraaf(startWet);
}

function filterNaam() {
  const q = document.getElementById('zoek').value.toLowerCase().trim();
  if (q.length < 2) return;
  const gevonden = indexData.find(w =>
    w.titel.toLowerCase().includes(q) || (w.identifier||'').toLowerCase().includes(q)
  );
  if (gevonden) toonGraaf(gevonden);
}

function setDiepte(d) {
  huidigeDiepte = d;
  document.querySelectorAll('[id^="d"]').forEach(b => b.classList.remove('actief'));
  document.getElementById('d' + d).classList.add('actief');
  if (geselecteerd) toonGraaf(geselecteerd);
}

function resetGraaf() {
  geselecteerd = null;
  toonStartscherm();
}

function vindVerwijzingen(wet, diepte, bezocht = new Set()) {
  const nodes = [];
  const links = [];

  function verwerk(w, huidigDiepte) {
    if (bezocht.has(w.identifier) || huidigDiepte > diepte) return;
    bezocht.add(w.identifier);

    nodes.push({
      id: w.identifier,
      label: w.titel,
      categorie: w.categorie,
      pad: w.pad,
      diepte: huidigDiepte,
    });

    // Zoek verwijzingen: wetten die deze wet noemen in hun pad/identifier
    const verwezen = indexData.filter(w2 =>
      w2.identifier !== w.identifier &&
      !bezocht.has(w2.identifier) &&
      (
        (w2.kamerstukken||[]).some(k => k.titel && k.titel.includes(w.identifier)) ||
        // Simpele heuristiek: zoek gerelateerde wetten via categorie
        (w2.categorie === w.categorie && huidigDiepte === 1)
      )
    ).slice(0, 8);

    verwezen.forEach(v => {
      links.push({ source: w.identifier, target: v.identifier, richting: 'naar' });
      if (huidigDiepte < diepte) verwerk(v, huidigDiepte + 1);
      else if (!bezocht.has(v.identifier)) {
        bezocht.add(v.identifier);
        nodes.push({ id: v.identifier, label: v.titel, categorie: v.categorie, pad: v.pad, diepte: huidigDiepte + 1 });
      }
    });
  }

  verwerk(wet, 0);
  return { nodes, links };
}

const CATEGORIE_KLEUR = {
  'Strafrecht':'#7f1d1d','Burgerlijk recht':'#1e3a5f','Bestuursrecht':'#374151',
  'Belastingrecht':'#78350f','Arbeidsrecht':'#064e3b','Sociaal recht':'#1e40af',
  'Gezondheidszorg':'#4c1d95','Onderwijs':'#0c4a6e','Milieu':'#14532d',
  'Verkeer':'#7c2d12','Digitaal en privacy':'#1e1b4b','Staatsinrichting en bestuur':'#1f2937',
};

function toonGraaf(wet) {
  geselecteerd = wet;
  const { nodes, links } = vindVerwijzingen(wet, huidigeDiepte);

  const svg = d3.select('#graaf');
  svg.selectAll('*').remove();

  const breedte = document.getElementById('graaf').clientWidth;
  const hoogte  = document.getElementById('graaf').clientHeight;

  const g = svg.append('g');

  // Zoom
  svg.call(d3.zoom().scaleExtent([0.3, 3]).on('zoom', e => g.attr('transform', e.transform)));

  // Pijlen
  svg.append('defs').append('marker')
    .attr('id', 'pijl').attr('viewBox', '0 -4 8 8').attr('refX', 18).attr('refY', 0)
    .attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto')
    .append('path').attr('d', 'M0,-4L8,0L0,4').attr('fill', '#94a3b8');

  simulatie = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(120))
    .force('charge', d3.forceManyBody().strength(-400))
    .force('center', d3.forceCenter(breedte / 2, hoogte / 2))
    .force('collision', d3.forceCollide(50));

  const link = g.append('g').selectAll('line').data(links).join('line')
    .attr('stroke', '#cbd5e1').attr('stroke-width', 1.5)
    .attr('marker-end', 'url(#pijl)');

  const node = g.append('g').selectAll('g').data(nodes).join('g')
    .style('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) simulatie.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end',   (e, d) => { if (!e.active) simulatie.alphaTarget(0); d.fx = null; d.fy = null; })
    )
    .on('click', (e, d) => {
      const w = bwbrNaarWet[d.id];
      if (w) toonInfo(w);
    })
    .on('mouseover', (e, d) => {
      const tt = document.getElementById('tooltip');
      tt.innerHTML = `<strong>${d.label}</strong><br><span style="opacity:0.6">${d.id}</span>`;
      tt.style.opacity = '1';
    })
    .on('mousemove', e => {
      const tt = document.getElementById('tooltip');
      tt.style.left = (e.offsetX + 12) + 'px';
      tt.style.top  = (e.offsetY - 30) + 'px';
    })
    .on('mouseout', () => { document.getElementById('tooltip').style.opacity = '0'; });

  node.append('circle')
    .attr('r', d => d.id === wet.identifier ? 18 : d.diepte === 1 ? 12 : 8)
    .attr('fill', d => d.id === wet.identifier ? '#FF6B00' : CATEGORIE_KLEUR[d.categorie] || '#6b7280')
    .attr('stroke', '#fff').attr('stroke-width', 2);

  node.append('text')
    .attr('text-anchor', 'middle').attr('dy', '2.8em')
    .attr('font-size', d => d.id === wet.identifier ? '11px' : '9px')
    .attr('font-family', 'JetBrains Mono, monospace')
    .attr('fill', '#374151')
    .text(d => d.label.length > 30 ? d.label.substring(0, 28) + '...' : d.label);

  simulatie.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  toonInfo(wet);
}

function toonInfo(wet) {
  document.getElementById('info-titel').textContent = wet.titel;
  document.getElementById('info-ident').textContent = wet.identifier + ' · ' + wet.categorie;
  document.getElementById('info-links').innerHTML = `
    <a href="${GITHUB_BASE}${wet.pad}" target="_blank">Bekijk wet op GitHub</a>
    <a href="https://wetten.overheid.nl/${wet.identifier}" target="_blank">wetten.overheid.nl</a>
    <a href="#" onclick="event.preventDefault(); toonGraaf(bwbrNaarWet['${wet.identifier}'])">Centreer in graaf</a>
  `;
  document.getElementById('info-paneel').classList.add('open');
}

function sluitInfo() {
  document.getElementById('info-paneel').classList.remove('open');
}

laadData();
</script>
</body>
</html>
